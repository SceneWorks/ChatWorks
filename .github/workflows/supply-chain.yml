name: Supply chain

# Ensures every platform bundle and resolved inference package comes from the one reviewed pin
# (a released runtime tag on main; an exact commit on a feature train) recorded in scripts/git-deps-pinned.csv.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pin-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the canonical inference release pin
        run: bash scripts/check-git-deps.sh
