[package]
name = "chatworks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
# Intel macOS and Windows/Linux select a Candle profile. CUDA builds use
# `--no-default-features --features cuda` on Windows/Linux; Apple Silicon uses MLX.
default = ["cpu"]
cpu = ["dep:runtime-cpu"]
cuda = ["dep:runtime-cuda"]
flash-attn = ["cuda", "runtime-cuda/flash-attn"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# The inference backend is chosen per-platform through one pinned SceneWorks/inference source:
# Apple Silicon MLX, Candle CPU on Intel macOS and Windows/Linux by default,
# or Candle CUDA on Windows/Linux via the `cuda` feature. `main` pins an immutable runtime release
# tag; this feature train (epic sc-24128) pins an exact inference commit (`rev`) until its terminal
# story replaces it with the released tag (scripts/check-git-deps.sh refuses a rev pin on main).

[dependencies]
axum = "0.8"
base64 = "0.22"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "time", "macros"] }
tokio-stream = "0.1"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# Inference backend — exactly one explicit LLM composition is selected per platform. Disabling the
# runtime bundle's default `media` feature keeps ChatWorks out of the unrelated media graph.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
runtime-macos = { git = "https://github.com/SceneWorks/inference", rev = "dbda066a079173380e544b690cfa455dee9b77b4", default-features = false }

[target.'cfg(not(all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
runtime-cpu = { git = "https://github.com/SceneWorks/inference", rev = "dbda066a079173380e544b690cfa455dee9b77b4", default-features = false, optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
runtime-cuda = { git = "https://github.com/SceneWorks/inference", rev = "dbda066a079173380e544b690cfa455dee9b77b4", default-features = false, optional = true }

# The workspace forbids `unsafe` (workspace `unsafe_code = "forbid"`), but this crate must relax it to
# `allow`: the Tauri framework's generated code (and some of its macro-expanded FFI) emits `unsafe`
# blocks that would otherwise trip the forbid lint at compile time. No hand-written `unsafe` lives in
# `src/`; this override exists solely so the framework's macro output links. Scope it crate-wide rather
# than per-module because the offending code is generated outside our sources (code-review F-006).
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "warn"
